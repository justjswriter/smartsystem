services:
  postgres:
    image: postgres:17.1-alpine
    container_name: smartsystem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: practice_db
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: practice_pass
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice_user -d practice_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: practice-backend/Dockerfile
    container_name: smartsystem_backend
    restart: unless-stopped
    environment:
      APP_NAME: Practice Backend
      APP_ENV: docker
      APP_DEBUG: "true"
      API_V1_PREFIX: /api/v1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: practice_db
      POSTGRES_USER: practice_user
      POSTGRES_PASSWORD: practice_pass
      DATABASE_URL: postgresql+asyncpg://practice_user:practice_pass@postgres:5432/practice_db
      SECRET_KEY: e8cb1c0ef5431eb5c5c893f510664d6bbe171532bb2a754e3610a8d1040c010d
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      ALGORITHM: HS256
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000","http://127.0.0.1:5173"]'
      LOG_LEVEL: INFO
      MOISTURE_MIN: 30
      TEMPERATURE_MAX: 35
      HUMIDITY_MIN: 30
      LIGHT_MIN: 200
      EMAIL_NOTIFICATIONS_ENABLED: "${EMAIL_NOTIFICATIONS_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: smart-plant-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    container_name: smartsystem_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
